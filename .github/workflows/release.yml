name: Release

# Builds the Flatpak bundle, the AppImage and the macOS disk image. On a
# version tag (v*) all three are attached to a GitHub release; a manual run
# keeps them as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Vendor crates for the offline build
        run: |
          pip install --break-system-packages aiohttp tomlkit
          curl -sSLo flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.birkmann.rille.yml
          bundle: rille-x86_64.flatpak
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}

  appimage:
    # The oldest supported Ubuntu LTS keeps the glibc requirement low.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev cmake pkg-config \
            libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev libudev-dev \
            libgl1-mesa-dev libxkbcommon-dev libfuse2 file
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          # The Wayland client is part of Qt 6.8's base package, not a module.
          modules: qtshadertools
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build AppImage
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          ./packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rille-x86_64.AppImage
          path: rille-*.AppImage

  macos:
    # Apple silicon. Qt's own macOS build (not Homebrew's) runs on macOS 12+.
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build app and disk image
        run: ./packaging/macos/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rille-macos-arm64.dmg
          path: target/macos/rille-macos-*.dmg

  release:
    # Publishes whatever was built, so one failing package does not hold back
    # the others; re-running a failed job afterwards adds its file.
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    needs: [flatpak, appimage, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.flatpak dist/*.AppImage dist/*.dmg)
          if (( ${#files[@]} == 0 )); then echo "Nothing was built."; exit 1; fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "rille ${GITHUB_REF_NAME#v}" --generate-notes "${files[@]}"
          fi
