[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["The rille contributors"]
repository = "https://github.com/birkmann/rille-01"
rust-version = "1.85"

[workspace.dependencies]
rille-core = { path = "crates/rille-core" }
bitflags = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
proptest = "1"
approx = "0.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

# Line tables keep backtraces useful without gigabytes of debug info.
[profile.dev]
debug = "line-tables-only"

# Dependencies (decoders, FFT, the time-stretcher) and the audio path are
# optimized even in dev builds: unoptimized, four keylocked decks miss the
# audio deadline (underruns, crackles).
[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.dev.package.signalsmith-stretch]
opt-level = 3

[profile.dev.package.rille-engine]
opt-level = 2

[profile.dev.package.rille-dsp]
opt-level = 2

[profile.dev.package.rille-decode]
opt-level = 2

[profile.dev.package.rille-analysis]
opt-level = 2

[profile.release]
lto = "thin"
debug = "line-tables-only"
