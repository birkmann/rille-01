# Allen & Heath Xone:K2
#
# MIDI numbers from the Mixxx mapping (Allen and Heath Xone K2.midi.xml and
# Allen-and-Heath-Xone-K2-scripts.js, Mixxx 2.x, GPL-2.0-or-later; author Be).
# The functions are laid out for rille: all four columns are decks.
#
# The K2 must be on its factory MIDI channel 15 with latching layers off
# (both are the defaults). Every note and CC below is on channel 15.
#
# DECK ORDER. Columns are written left to right as decks A B C D; the
# `deck_layouts` line decides which app deck each column drives. The mapping
# appears twice in Settings -> Controllers:
#   "Allen & Heath Xone:K2 (CABD)"  columns = C A B D  (default)
#   "Allen & Heath Xone:K2 (ABCD)"  columns = A B C D
# The choice is remembered per device.
#
# MODIFIERS (hold): SHIFT = bottom-right button (note 15),
# LAYER = bottom-left button (note 12), BROWSE = press the right bottom
# encoder (note 14).
#
# Per column (k = 0..3 from the left):
#   control          MIDI       plain            SHIFT            LAYER
#   encoder turn     CC k       nudge (jog)      tempo (fine)
#   encoder press    note 52+k  sync             tempo reset      master
#   knob row 1       CC 4+k     EQ high          gain
#   knob row 2       CC 8+k     EQ mid
#   knob row 3       CC 12+k    EQ low           filter
#   button A         note 48+k  headphone cue    keylock          loop in
#   button B         note 44+k  cue              cue-play (CUP)   loop out
#   button C         note 40+k  play             reverse          loop on/off
#   fader            CC 16+k    volume
#   grid row 1       note 36+k  hotcue 1         delete hotcue 1  loop /2
#   grid row 2       note 32+k  hotcue 2         delete hotcue 2  loop x2
#   grid row 3       note 28+k  hotcue 3         delete hotcue 3  beatjump back
#   grid row 4       note 24+k  hotcue 4         delete hotcue 4  beatjump fwd
#   BROWSE + button C loads the selected track into that column's deck.
#
# Global:
#   right encoder    CC 21      browse list      SHIFT: browse tree
#   right press      note 14    BROWSE (hold)    SHIFT: expand/collapse node
#   left encoder     CC 20      cue mix          SHIFT: cue volume
#   left press       note 13                     SHIFT: quantize
#
# Encoders send 1 per detent clockwise and 127 counter-clockwise (two's
# complement). Knobs and faders are 7-bit absolute with soft takeover, so a
# knob shared through SHIFT picks its value up before it moves anything.
#
# LEDs: each button has one LED with three colours on three notes: the button's
# note (red), note + 36 (amber) and note + 72 (green). Sync is green, headphone
# cue amber, cue red, play green, hotcues red when set. Off is sent as note on
# with velocity 0 on the colour's note.
#
# Not mapped: crossfader and main level (the K2 has neither), FX units, the
# LAYER and SHIFT LEDs, and the other MIDI channels Mixxx uses for alternative
# layouts.

name = "Allen & Heath Xone:K2"
device = '(?i)xone:?\s*k2'
description = "Allen & Heath Xone:K2 as a 4-deck controller (MIDI channel 15)"
deck_layouts = ["CABD", "ABCD"]

# Modifiers
[[input]]
target = "modifier:shift"
midi = { type = "note", channel = 15, number = 15 }  # 9E 0F

[[input]]
target = "modifier:layer"
midi = { type = "note", channel = 15, number = 12 }  # 9E 0C

[[input]]
target = "modifier:browse"
midi = { type = "note", channel = 15, number = 14 }  # 9E 0E

# Browser and headphones
