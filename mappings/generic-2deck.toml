# Generic 2-deck controller mapping.
#
# A template for controllers without a dedicated mapping and a reference for
# the file format. Program your controller (or its editor software) to send
# the messages below, or copy this file to ~/.config/rille/mappings/, change
# `device` to match your port name and adjust the numbers.
#
# Layout:
#   channel 1 = deck A, channel 2 = deck B (identical note/CC numbers)
#   channel 3 = mixer/global section and FX unit 1
#   note 63 on channel 3 = SHIFT (hold)
#
# Per deck (channel 1 / 2):
#   notes 0-7    hotcue 1-8          SHIFT: delete hotcue 1-8
#   note 11      play                SHIFT: reverse
#   note 12      cue                 SHIFT: cue-play (CUP)
#   note 13      sync                SHIFT: master (tempo leader)
#   note 14      keylock
#   note 15      headphone cue (PFL)
#   note 16      load selected track SHIFT: eject
#   notes 20-26  loop in, loop out, loop on/off, loop /2, loop x2,
#                beatjump back, beatjump forward
#   notes 30/31  tempo bend down/up
#   note 54      jog wheel touch
#   CC 7 volume, CC 8 gain, CC 9/10/11 EQ hi/mid/lo, CC 12 filter,
#   CC 13 tempo (all absolute, soft-takeover)
#   CC 16        jog wheel, relative two's complement (1 = +1 tick, 127 = -1),
#                128 ticks per revolution
#
# Global (channel 3):
#   CC 1 crossfader, CC 2 main level, CC 3 cue mix, CC 4 cue volume
#   CC 10 browser scroll (relative), note 10 browser expand/collapse
#   note 20 quantize, note 63 SHIFT
#   FX unit 1: CC 20 dry/wet, CC 21-23 knobs 1-3, note 30 on,
#              notes 31-33 buttons 1-3, CC 24 effect select (relative)
#
# LEDs mirror the buttons on the same note numbers (127 = on, 0 = off).
#
# Drum machine targets (not bound here; see the README for the full list):
#   drum.play, drum.record, drum.step.1-16, drum.accent.1-16 (selected
#   instrument), drum.cell.1-128 (instrument * 16 + step), drum.inst.1-8,
#   drum.trigger.1-8, drum.inst_mute.1-8, drum.sel_level / sel_tune /
#   sel_decay, drum.pattern.1-16, drum.pattern_select (relative),
#   drum.level, drum.filter, drum.fx_assign.1-2, drum.pfl, drum.show.
#   Outputs: drum.step.N (steps on, playhead running), drum.step_led.N and
#   drum.inst_led.N (RGB pad codes, use `raw = true`).
#
# Format notes (see crates/rille-midi/src/mapping.rs):
#   midi.type: note | cc | cc14 (MSB number, LSB number+32) | pitchbend
#   mode (optional, inferred from the target): button | absolute | relative | jog
#   encoding: twos_complement | binary_offset | sign_magnitude
#   step, ticks_per_rev, invert, soft_takeover, min, max
#   condition = { modifier = "shift", value = true }  (value defaults to true)
#   latch = true    (modifier inputs) each press toggles the modifier
#   tap = true      (button inputs) acts when let go, unless a binding on a
#                   modifier the same button holds was used meanwhile

name = "Generic 2-deck"
device = "(?i)generic"
description = "Template: deck A on channel 1, deck B on channel 2, mixer on channel 3"

