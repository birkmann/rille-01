# Hercules DJControl Inpulse 200
#
# Derived from the Mixxx mapping (Hercules_DJControl_Inpulse_200.midi.xml and
# Hercules-DJControl-Inpulse-200-script.js, GPL-2.0-or-later; author DJ Phatso
# for Hercules Technical Support, contributions by Kerrick Staley). Only
# bindings whose MIDI messages and meaning are documented there are included.
#
# SHIFT is handled in hardware: shifted buttons send on other channels.
# MIDI channels: 1 = global, 2/3 = deck A/B, 5/6 = deck A/B with SHIFT,
# 7/8 = deck A/B pads. Knobs and faders are 7-bit except the tempo faders
# (14-bit, MSB 0x08 / LSB 0x28). Trailing comments give the raw status and
# data bytes in hex as in the Mixxx XML.
#
# Jog wheels (script scratchWheel/bendWheel): 1 = clockwise, 127 = counter
# clockwise (two's complement), 248 ticks per revolution
# (engine.scratchEnable(deck, 248, ...)). CC 0x0A = top (touch), 0x09 = side.
#
# Tempo direction is taken as-is from the Mixxx mapping; set invert = true on
# the tempo inputs if the fader runs the wrong way.
#
# Not mapped: vinyl button (the app decides scratch vs bend from jog_touch),
# SHIFT+PLAY (stutter), SHIFT+CUE (start), SHIFT+jog (seek), browser button,
# SHIFT+browser knob, beat loop roll, FX slot and sampler pads, AutoDJ.
# Note that the Inpulse 200 has no mid EQ.

name = "Hercules DJControl Inpulse 200"
device = "(?i)inpulse 200"
description = "Hercules DJControl Inpulse 200 (converted from the Mixxx mapping)"

# Global (channel 1)
[[input]]
target = "global.crossfader"
midi = { type = "cc", channel = 1, number = 0 }  # B0 00

[[input]]
target = "global.scroll"
midi = { type = "cc", channel = 1, number = 1 }  # B0 01
encoding = "twos_complement"

# Deck A (channel 2, SHIFT layer channel 5)
[[input]]
