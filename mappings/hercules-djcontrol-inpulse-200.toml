midi = { type = "note", channel = 2, number = 13 }  # 91 0D

[[input]]
target = "deck.A.loop_in"
midi = { type = "note", channel = 2, number = 9 }  # 91 09

[[input]]
target = "deck.A.loop_out"
midi = { type = "note", channel = 2, number = 10 }  # 91 0A

[[input]]
target = "deck.A.master"
midi = { type = "note", channel = 5, number = 5 }  # 94 05

[[input]]
target = "deck.A.loop_halve"
