midi = { type = "cc", channel = 2, number = 1 }  # B1 01

[[input]]
target = "deck.A.tempo"
midi = { type = "cc14", channel = 2, number = 8 }  # B1 08 + 28

# Deck A pads (channel 7): hotcues 1-4, SHIFT deletes; FX unit 1 assign
