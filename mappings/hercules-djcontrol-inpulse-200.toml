[[input]]
target = "deck.A.jog"
midi = { type = "cc", channel = 2, number = 10 }  # B1 0A
encoding = "twos_complement"
ticks_per_rev = 248

[[input]]
target = "deck.A.jog"
midi = { type = "cc", channel = 2, number = 9 }  # B1 09
encoding = "twos_complement"
ticks_per_rev = 248

[[input]]
target = "deck.A.volume"
