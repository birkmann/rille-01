# Pioneer DDJ-400
#
# Derived from the Mixxx mapping (Pioneer-DDJ-400.midi.xml and
# Pioneer-DDJ-400-script.js, Mixxx 2.x, GPL-2.0-or-later; authors Warker,
# nschloe, dj3730, jusko, tiesjan). Only bindings whose MIDI messages and
# meaning are documented there are included.
#
# The DDJ-400 handles SHIFT in hardware: shifted buttons send different notes
# (e.g. SHIFT+PLAY = note 0x47), so few inputs need a condition here.
#
# MIDI channels: 1 = deck 1, 2 = deck 2, 5 = Beat FX, 7 = mixer/browser,
# 8/9 = deck 1 pads (normal/SHIFT), 10/11 = deck 2 pads (normal/SHIFT).
# Knobs and faders are 14-bit (MSB on n, LSB on n+32). Trailing comments give
# the raw status and data bytes in hex as in the Mixxx XML.
#
# Jog wheels (script jogTurn): relative, centered at 64 (binary offset),
# 720 ticks per revolution (engine.scratchEnable(deck, 720, ...)).
# CC 0x22 = platter top (vinyl mode), 0x23 = platter top (vinyl mode off),
# 0x21 = outer ring (bend). The app decides scratch vs bend via jog_touch.
#
# Tempo: the fader sends 0 at the top. The DDJ-400 marks the top as "-", so
# with rille's tempo (> 0.5 = faster) no inversion is needed. Set invert = true
# on the tempo inputs if your fader runs the other way.
#
# Not mapped (no rille equivalent or scripted behaviour): SHIFT+CUE (jump to
# start), SHIFT+SYNC (tempo range), SHIFT+LOOP IN/OUT (loop adjust), beat loop,
# sampler and other pad modes, Beat FX left/right and channel select,
# SHIFT+jog search, BROWSE press, VU meters.

name = "Pioneer DDJ-400"
device = "(?i)ddj-400"
description = "Pioneer DDJ-400 (converted from the Mixxx mapping)"

# Browser and loading (channel 7)
[[input]]
target = "global.scroll"
midi = { type = "cc", channel = 7, number = 64 }  # B6 40
