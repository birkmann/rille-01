# Native Instruments Traktor Kontrol F1
#
# The F1 is a HID device, not MIDI: rille reads its reports as described in
# the [hid] table below (see crates/rille-midi/src/hid.rs) and presents them
# as MIDI on channel 1, which is what the rest of this file maps. The report layout comes from the device's HID report
# descriptor and Mixxx's Traktor-Kontrol-F1-scripts.js (Ilkka Tuohela).
#
# On Linux, opening the device needs the udev rule in
# packaging/udev/70-rille-controllers.rules (installed by the Arch package).
#
# The F1 drives a remix deck: a deck switched to remix mode, with four slots
# (columns) of sample cells. The 4x4 pads show one page of four rows; track
# decks ignore these controls.
#
# Translated messages:
#   notes 7-0        pads 1-8 (top two rows, left to right: pad 1 = note 7)
#   notes 15-8       pads 9-16 (bottom two rows: pad 9 = note 15)
#   note 18          encoder press
#   notes 19-23      BROWSE, SIZE, TYPE, REVERSE, SHIFT
#   notes 25-27      CAPTURE, QUANT, SYNC
#   notes 31-28      the buttons under faders 1-4 (STOP / mute)
#   14-bit CC 0-3    knobs 1-4;  CC 4-7  faders 1-4
#   CC 64            encoder (relative, two's complement), plus per tick
#                    note 48/49 = cw/ccw (not mapped here)
#
#   control             plain                 held modifier
#   pads 1-16           trigger the cell      SHIFT: delete the cell
#                                             CAPTURE: capture a loop into it
#                                             TYPE: loop <-> one-shot
#                                             BROWSE: load the selected track
#   knobs 1-4           slot 1-4 filter
#   faders 1-4          slot 1-4 volume (both without soft takeover: the
#                       F1 sets the slots as soon as it connects or moves)
#   STOP 1-4            stop slot 1-4         SHIFT: mute slot 1-4 (toggle)
#   encoder             page of the pads      SIZE: quantize size
#                                             CAPTURE: capture source deck
#                                             BROWSE: browse list
#                                             SHIFT: tempo
#   encoder press       play / pause          SHIFT: cue (stop, back to bar 1)
#                                             BROWSE: expand/collapse node
#   SYNC                sync                  SHIFT: master (tempo leader)
#   QUANT               quantize triggered samples on/off
#   SHIFT, CAPTURE, TYPE, SIZE, BROWSE        modifiers, lit while held
#   REVERSE             a modifier with no function yet (lit while held)
#
# LEDs: SYNC, QUANT and the STOP buttons (lit while their slot plays) on
# channel 1, note = output report byte, dimmed when off. Pads show their
# cell's colour, bright while it plays, on channel 2 (note = pad, velocity =
# LED code, see rille_core::remix::led_code); the two-digit display shows the
# pad page on channel 3 (CC 0), and the capture source deck (A, b, C, d)
# while CAPTURE is held. Both use raw = true, which sends the value itself
# instead of an on/off brightness.
#
# CAPTURING: hold CAPTURE, turn the encoder to choose the deck to take the
# loop from (the display shows its letter), then press the pad whose cell
# should get it. The pad lights up in its slot's colour.
#
# DECK ORDER: the F1 drives the first remix deck (C by default); choose
# "Traktor Kontrol F1 (C)", "(D)", "(A)" or "(B)" to fix it to one deck. The
# file itself uses deck A for the F1's deck.

name = "Traktor Kontrol F1"
device = '(?i)traktor kontrol f1 hid'
description = "Native Instruments Traktor Kontrol F1 (HID): a remix deck with 4x4 RGB pads"
deck_layouts = ["C", "D", "A", "B"]

# Report layout. Byte offsets count the report ID as byte 0.
[hid]
name = "Traktor Kontrol F1"
vendor_id = 0x17cc
product_id = 0x1120
input_report = 0x01
# Knobs 1-4, faders 1-4. Mixxx found the range ends at 4092.
knobs = [0x06, 0x08, 0x0A, 0x0C, 0x0E, 0x10, 0x12, 0x14]
knob_mask = 0x0FFF
knob_max = 4092
buttons = [0x01, 4]
encoders = [{ offset = 0x05, bits = 8, cc = 64, note = 48 }]
outputs = [[0x80, 0x51]]
# BROWSE, SIZE, TYPE, REVERSE, SHIFT, CAPTURE: modifiers, lit while held.
held_leds = [[19, 0x11, 0x0A], [20, 0x12, 0x0A], [21, 0x13, 0x0A], [22, 0x14, 0x0A], [23, 0x15, 0x0A], [25, 0x16, 0x0A]]
# Blue, red, green per pad.
rgb_pads = { offset = 0x19, count = 16, order = [2, 0, 1] }
# Decimal point, then segments g, c, b, a, f, e, d; Mixxx lights them at 0x40.
displays = [{ digits = [0x09, 0x01], segments = [4, 3, 2, 7, 6, 5, 1], brightness = 0x40 }]

# Modifiers
[[input]]
target = "modifier:shift"
midi = { type = "note", channel = 1, number = 23 }

[[input]]
target = "modifier:capture"
midi = { type = "note", channel = 1, number = 25 }

[[input]]
target = "modifier:type"
midi = { type = "note", channel = 1, number = 21 }

[[input]]
