# Native Instruments Traktor Kontrol X1 (MK1)
#
# The X1 MK1 is neither MIDI nor HID: on Linux the kernel's snd-usb-caiaq
# driver claims it and offers its controls as an input device and its LEDs as
# mixer controls of a sound card. rille reads both (transport = "caiaq", see
# crates/rille-midi/src/caiaq.rs), rebuilds the input events into reports
# described by the [hid] table below, and presents them as MIDI on channel 1,
# which is what the rest of this file maps. Button, knob and encoder positions
# come from the kernel driver (sound/usb/caiaq/input.c and control.c) and
# x1-mk1-usb2midi by Opa- (board.yml, Apache-2.0), which agree on them. Not
# checked on a device: which way the encoders count, and the SHIFT and HOTCUE
# LEDs (the driver's control names are used; x1-mk1-usb2midi lights HOTCUE on
# the control the driver calls "LED Shift (green)").
#
# On Linux, reading the input device needs the udev rule in
# packaging/udev/70-rille-controllers.rules (installed by the Arch package).
#
# Translated messages:
#   14-bit CC 0-3    FX 1 dry/wet, knobs 1-3;  CC 4-7  FX 2 dry/wet, knobs 1-3
#   notes 28-31      FX 1 ON, buttons 1-3;  notes 32-35  FX 2 ON, buttons 1-3
#   notes 9 / 8      left deck to FX 1 / FX 2;  notes 38 / 37  right deck
#   note 36          SHIFT (held as a modifier)
#   note 39          HOTCUE (toggles hotcue mode, a latched modifier)
#   notes 24 / 25    browse encoder press, left / right
#   notes 26 / 27    loop encoder press, left / right
#   left deck:  IN 20, OUT 3, BEAT< 2, BEAT> 21, CUE 1, CUP 22, PLAY 0, SYNC 23
#   right deck: IN 12, OUT 19, BEAT< 18, BEAT> 13, CUE 17, CUP 14, PLAY 16,
#               SYNC 15
#   CC 64 / 65       browse encoders, left / right (relative, two's complement)
#   CC 66 / 67       loop encoders, left / right; plus per tick notes 48/49,
#                    50/51 (browse), 52/53, 54/55 (loop) = cw/ccw
#
#   control             plain                 SHIFT held           HOTCUE mode
#   IN / OUT            loop in / out         delete hotcue 1 / 5  hotcue 1 / 5
#   BEAT< / BEAT>       beatjump back / fwd   delete hotcue 2 / 6  hotcue 2 / 6
#   CUE / CUP           cue / cue-play (CUP)  delete hotcue 3 / 7  hotcue 3 / 7
#   PLAY / SYNC         play / sync           delete hotcue 4 / 8  hotcue 4 / 8
#   browse encoder      browse list           browse tree
#   browse press        load selected track   expand/collapse node
#   loop encoder        loop x2 / loop /2     tempo (fine)
#   loop press          loop on/off           tempo reset
#   FX dry/wet knob     FX unit dry/wet
#   FX knobs 1-3        effect 1-3 amount     effect 1-3 setting
#   FX ON               FX unit on/off
#   FX buttons 1-3      effect 1-3 on/off     next effect in slot 1-3
#   FX assign           deck to FX unit 1/2
#   HOTCUE              hotcue mode on/off    switch decks (A/B <-> C/D)
#
# SHIFT also deletes hotcues in hotcue mode: a held modifier takes precedence
# over a latched one.
#
# LEDs (output report byte = the driver's LED index + 1, the byte the device
# gets): buttons are dimmed when off, as on the hardware. In hotcue mode the
# deck buttons light when their hotcue is set; HOTCUE lights while the mode is
# on, SHIFT while held.
#
# DECK ORDER: the left/right columns drive decks A/B or C/D. A newly seen X1
# MK1 takes the pair no other X1 MK1 uses, so a second one drives C/D. SHIFT + HOTCUE
# switches between the pairs, and Settings > Controllers picks one; the
# choice is remembered per X1.

name = "Traktor Kontrol X1 MK1"
device = '(?i)traktor kontrol x1 mk1 hid'
description = "Native Instruments Traktor Kontrol X1 MK1 (snd-usb-caiaq): two decks and two FX units"
deck_layouts = ["AB", "CD"]

# Report layout of the rebuilt reports (see crates/rille-midi/src/caiaq.rs).
[hid]
name = "Traktor Kontrol X1 MK1"
vendor_id = 0x17cc
product_id = 0x2305
transport = "caiaq"
input_report = 0x01
# FX 1 dry/wet and knobs 1-3 (ABS_HAT0X-3X), FX 2 the same (ABS_HAT0Y-3Y).
knobs = [0x08, 0x0C, 0x10, 0x14, 0x0A, 0x0E, 0x12, 0x16]
knob_mask = 0x0FFF
knob_max = 4095
buttons = [0x01, 5]
encoders = [
    { offset = 0x06, shift = 0, bits = 4, cc = 64, note = 48 }, # left browse
    { offset = 0x06, shift = 4, bits = 4, cc = 65, note = 50 }, # right browse
    { offset = 0x07, shift = 0, bits = 4, cc = 66, note = 52 }, # left loop
    { offset = 0x07, shift = 4, bits = 4, cc = 67, note = 54 }, # right loop
]
# The LED state the driver sends (command 0x0C, then one byte per LED).
outputs = [[0x0C, 32]]
held_leds = [[36, 30, 5]]
alsa_leds = [
    [1, "LED FX B: 3"],
    [2, "LED FX B: 2"],
    [3, "LED FX B: 1"],
    [4, "LED FX B: ON"],
    [5, "LED FX A: 3"],
    [6, "LED FX A: 2"],
    [7, "LED FX A: 1"],
    [8, "LED FX A: ON"],
    [9, "LED Deck B: SYNC"],
    [10, "LED Deck B: PLAY"],
    [11, "LED Deck B: CUP/REL"],
    [12, "LED Deck B: CUE/ABS"],
    [13, "LED Deck B: BEAT >"],
    [14, "LED Deck B: < BEAT"],
    [15, "LED Deck B: OUT"],
    [16, "LED Deck B: IN"],
    [17, "LED Deck A: OUT"],
    [18, "LED Deck A: IN"],
    [19, "LED Deck A: BEAT >"],
    [20, "LED Deck A: < BEAT"],
    [21, "LED Deck A: CUP/REL"],
    [22, "LED Deck A: CUE/ABS"],
    [23, "LED Deck A: SYNC"],
    [24, "LED Deck A: PLAY"],
    [25, "LED Deck A: FX1"],
    [26, "LED Deck A: FX2"],
    [27, "LED Deck B: FX1"],
    [28, "LED Deck B: FX2"],
    [29, "LED Hotcue"],
    [30, "LED Shift (white)"],
    [31, "LED Shift (green)"],
]

