condition = { modifier = "shift" }

[[input]]
target = "fx.1.knob.3"
midi = { type = "cc14", channel = 1, number = 3 }

[[input]]
target = "fx.1.param.3"
midi = { type = "cc14", channel = 1, number = 3 }
condition = { modifier = "shift" }

[[input]]
target = "fx.1.on"
midi = { type = "note", channel = 1, number = 7 }

[[input]]
target = "fx.1.button.1"
midi = { type = "note", channel = 1, number = 6 }

[[input]]
target = "fx.1.select.1"
midi = { type = "note", channel = 1, number = 6 }
mode = "relative"
condition = { modifier = "shift" }

[[input]]
target = "fx.1.button.2"
