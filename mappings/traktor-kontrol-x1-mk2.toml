# Native Instruments Traktor Kontrol X1 MK2
#
# The X1 MK2 is a HID device, not MIDI: rille reads its reports as described
# in the [hid] table below (see crates/rille-midi/src/hid.rs) and presents
# them as MIDI on channel 1, which is what the rest of this file maps. The report layout comes from the Mixxx HID mapping by
# infiniteloop (Traktor-Kontrol-X1-MK2-hid-scripts.js, 2021, based on the
# Mixxx S2 MK2 script).
#
# On Linux, opening the device needs the udev rule in
# packaging/udev/70-rille-controllers.rules (installed by the Arch package).
#
# Translated messages:
#   14-bit CC 0-3    FX 1 dry/wet, knobs 1-3;  CC 4-7  FX 2 dry/wet, knobs 1-3
#   notes 7 / 3      FX 1 / 2 ON (the left button of each FX row)
#   notes 6,5,4      FX 1 buttons 1-3;  notes 2,1,0  FX 2 buttons 1-3
#   notes 15,14      left deck to FX 1, FX 2;  notes 13,12  right deck
#   note 10          SHIFT (held as a modifier)
#   notes 11 / 9     LOAD left / right
#   notes 32 / 8     encoder press left / right;  note 33  browse press
#   left deck:  notes 31-28 pads 1-4, 27 FLUX, 26 SYNC, 25 CUE, 24 PLAY
#   right deck: notes 23-20 pads 1-4, 19 FLUX, 18 SYNC, 17 CUE, 16 PLAY
#   CC 64 browse encoder; CC 65 / 66 deck encoders (relative, two's complement),
#   plus per tick note 48/49 (browse), 50/51 (left), 52/53 (right) = cw/ccw
#   CC 70 / 71       touch strip, left / right half (relative)
#   notes 56 / 57    touch strip left / right half touched (not mapped here)
#
#   control             plain                 SHIFT held
#   PLAY                play / pause          reverse
#   CUE                 cue                   cue-play (CUP)
#   SYNC (tap)          sync                  master (tempo leader)
#   FLUX                flux                  keylock
#   pads 1-4            hotcue 1-4            delete hotcue 1-4
#   LOAD                load selected track   eject
#   deck encoder        loop x2 / loop /2     beatjump forward / back
#   SYNC held + deck encoder   tempo, about 0.1 BPM per click at 128 BPM
#                       (a synced deck moves the tempo of all synced decks)
#   deck encoder press  loop on/off           tempo reset
#   touch strip half    nudge (jog)           tempo (fine)
#   FX dry/wet knob     FX unit dry/wet
#   FX knobs 1-3        effect 1-3 amount     effect 1-3 setting (delay time,
#                                             reverb size, filter cutoff, ...)
#   FX ON               FX unit on/off
#   FX buttons 1-3      effect 1-3 on/off     next effect in slot 1-3
#   FX assign           deck to FX unit 1/2
#   browse encoder      browse list           browse tree
#   browse press        expand/collapse node  switch decks (A/B <-> C/D)
#
# SYNC acts when let go, and not after the encoder was turned while it was
# held (tap = true), so changing the tempo leaves sync as it was.
#
# LEDs (output report byte = note number): FX and deck buttons are dimmed
# when off, as on the hardware; pads light blue when their hotcue is set;
# SHIFT lights while held. The segment displays show each deck's loop size
# (the size the deck encoder changes, also used for beatjumps).
#
# DECK ORDER: the left/right columns drive decks A/B or C/D. A newly seen X1
# takes the pair no other X1 uses, so a second one drives C/D. SHIFT + browse
# press switches between the pairs, and Settings > Controllers picks one; the
# choice is remembered per X1. The displays show the decks for a moment
# after connecting or switching.

name = "Traktor Kontrol X1 MK2"
device = '(?i)traktor kontrol x1 mk2 hid'
description = "Native Instruments Traktor Kontrol X1 MK2 (HID): two decks and two FX units"
deck_layouts = ["AB", "CD"]

# Report layout. Byte offsets count the report ID as byte 0.
[hid]
name = "Traktor Kontrol X1 MK2"
vendor_id = 0x17cc
product_id = 0x1220
# Its only HID interface is 0 (Mixxx's file says 4; checked on a device).
input_report = 0x01
# FX 1 dry/wet and knobs 1-3, FX 2 dry/wet and knobs 1-3.
knobs = [0x01, 0x03, 0x05, 0x07, 0x09, 0x0B, 0x0D, 0x0F]
knob_mask = 0x0FFF
knob_max = 4095
buttons = [0x13, 5]
encoders = [
    { offset = 0x11, shift = 4, bits = 4, cc = 64, note = 48 }, # browse
    { offset = 0x11, shift = 0, bits = 4, cc = 65, note = 50 }, # left deck
    { offset = 0x12, shift = 0, bits = 4, cc = 66, note = 52 }, # right deck
]
strip = { offsets = [0x1B, 0x1D], cc = [70, 71], note = [56, 57] }
# Button and pad LEDs; the segment displays and touch strip LEDs.
outputs = [[0x80, 0x34], [0x81, 0x5B]]
held_leds = [[10, 0x12, 0x03]]
# Three digits per deck in report 0x81: a decimal point byte, then segments
# g, c, b, a, f, e, d (from infiniteloop's script; not checked on a device).
displays = [
    { report = 1, cc = 0, digits = [0x01, 0x09, 0x11], segments = [4, 3, 2, 7, 6, 5, 1], brightness = 0x7F },
    { report = 1, cc = 1, digits = [0x19, 0x21, 0x29], segments = [4, 3, 2, 7, 6, 5, 1], brightness = 0x7F },
]

# SHIFT and browser
[[input]]
target = "modifier:shift"
midi = { type = "note", channel = 1, number = 10 }

[[input]]
target = "global.scroll"
midi = { type = "cc", channel = 1, number = 64 }
encoding = "twos_complement"

[[input]]
target = "global.tree_scroll"
midi = { type = "cc", channel = 1, number = 64 }
encoding = "twos_complement"
condition = { modifier = "shift" }

[[input]]
target = "global.toggle_node"
midi = { type = "note", channel = 1, number = 33 }

[[input]]
target = "deck_layout:next"
midi = { type = "note", channel = 1, number = 33 }
condition = { modifier = "shift" }

