# Flatpak manifest. The app id follows the GitHub repository; change it
# together with packaging/rille.metainfo.xml.
#
# Build (needs network for the runtimes and for vendoring crates; the release
# workflow in .github/workflows/release.yml does the same):
#   python3 flatpak-cargo-generator.py ../../Cargo.lock -o cargo-sources.json
#   flatpak-builder --user --install-deps-from=flathub --install --force-clean build io.github.birkmann.rille.yml
#
# The KDE 6.11 runtime is based on freedesktop 25.08; the SDK extensions
# below resolve to that branch.
app-id: io.github.birkmann.rille
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: rille
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Audio through PipeWire (and its JACK/ALSA layers). Not --socket=pipewire:
  # older flatpak versions, including the one that builds the bundle, reject it.
  - --filesystem=xdg-run/pipewire-0
  # MIDI controllers (ALSA sequencer, raw MIDI) and HID controllers
  # (/dev/hidraw*, or /dev/input/event* and ALSA controls for the X1 MK1; the
  # host still needs packaging/udev/70-rille-controllers.rules).
  - --device=all
  # Music folders.
  - --filesystem=xdg-music
  - --filesystem=home:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
  env:
    CARGO_HOME: /run/build/rille/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: rille
    buildsystem: simple
    build-commands:
      - cargo --offline build --release -p rille-ui -p rille-cli
      - SKIP_BUILD=1 PREFIX=/app ./scripts/install.sh
      - mv /app/share/applications/rille.desktop /app/share/applications/io.github.birkmann.rille.desktop
      - sed -i 's/^Icon=rille$/Icon=io.github.birkmann.rille/' /app/share/applications/io.github.birkmann.rille.desktop
      - sed -i 's#rille.desktop</launchable>#io.github.birkmann.rille.desktop</launchable>#' /app/share/metainfo/io.github.birkmann.rille.metainfo.xml
      - for f in /app/share/icons/hicolor/*/apps/rille.*; do mv "$f" "${f%/*}/io.github.birkmann.rille.${f##*.}"; done
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
